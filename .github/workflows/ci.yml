name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          swiftc -O -target arm64-apple-macosx13.0 -o mwr-arm64 main.swift
          swiftc -O -target x86_64-apple-macosx13.0 -o mwr-x64 main.swift
          lipo -create -output MouseWheelReverser mwr-arm64 mwr-x64
      - name: Smoke test (help)
        run: ./MouseWheelReverser --help
