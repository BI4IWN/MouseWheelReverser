name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: |
          swiftc -O -target arm64-apple-macosx13.0 -o mwr-arm64 main.swift
          swiftc -O -target x86_64-apple-macosx13.0 -o mwr-x64 main.swift
          lipo -create -output MouseWheelReverser mwr-arm64 mwr-x64

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: MouseWheelReverser
          generate_release_notes: true
