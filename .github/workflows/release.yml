name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal binary
        run: swiftc -O -arch arm64 -arch x86_64 -o MouseWheelReverser main.swift

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: MouseWheelReverser
          generate_release_notes: true
